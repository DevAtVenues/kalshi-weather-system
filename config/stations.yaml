# Kalshi weather market cities with their settlement stations.
# nws_station: the NWS CLI report station Kalshi settles on (verify per market rules).
# metar_station: same station — all are on the ASOS/METAR network.
# kalshi_series: primary active Kalshi series ticker for this city.
# lst_offset_hours: UTC offset in standard time (no DST); settlement day boundary.
#
# NYC settles on KNYC (Central Park), not an airport.
# Chicago settles on KMDW (Midway), NOT KORD (O'Hare) — confirmed from contract rules.
# DO NOT assume the main commercial airport. Verify each city from its market rules page.

NYC:
  city: "New York City"
  nws_station: "KNYC"
  metar_station: "KNYC"
  kalshi_series: "KXHIGHNY"
  kalshi_low_series: "KXLOWTNYC"
  lat: 40.7789
  lon: -73.9692
  timezone: "America/New_York"
  lst_offset_hours: -5

CHI:
  city: "Chicago"
  nws_station: "KMDW"   # Kalshi KXHIGHCHI settles on NWS CLI at Midway, NOT O'Hare
